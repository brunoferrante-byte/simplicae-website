  "Set the identity and context of this game model. These details drive your cover page, headers and footers in the final presentation.":{fr:"Définissez l'identité et le contexte de ce modèle de jeu. Ces détails alimentent votre page de couverture, vos en-têtes et pieds de page dans la présentation finale.",es:"Define la identidad y el contexto de este modelo de juego. Estos detalles alimentan la portada, los encabezados y pies de página en la presentación final."},
  "Team logo upload is a placeholder in Build 1 and will attach to your cover page when the presentation builder ships.":{fr:"Le téléversement du logo est un espace réservé dans le Build 1 et sera ajouté à votre page de couverture lorsque le générateur de présentation sera disponible.",es:"La carga del logotipo es un marcador en el Build 1 y se añadirá a tu portada cuando esté disponible el generador de presentaciones."},
  "Your model starts with beliefs, not a formation. Answer the prompts and watch your philosophy take shape on the right.":{fr:"Votre modèle commence par des convictions, pas par un système. Répondez aux questions et voyez votre philosophie prendre forme à droite.",es:"Tu modelo comienza con convicciones, no con una formación. Responde las preguntas y observa cómo tu filosofía toma forma a la derecha."},
  "Write in your own coaching voice.":{fr:"Écrivez avec votre propre voix d'entraîneur.",es:"Escribe con tu propia voz de entrenador."},
  "Translate your philosophy into the team's football identity. Add the principles that define how your team plays.":{fr:"Traduisez votre philosophie en identité de jeu de l'équipe. Ajoutez les principes qui définissent la façon dont votre équipe joue.",es:"Traduce tu filosofía en la identidad de juego del equipo. Añade los principios que definen cómo juega tu equipo."},
  "One or two lines on what your team stands for.":{fr:"Une ou deux lignes sur ce que votre équipe représente.",es:"Una o dos líneas sobre lo que representa tu equipo."},
  "Add attacking, defending and transition principles. Reorder as your model grows.":{fr:"Ajoutez des principes offensifs, défensifs et de transition. Réorganisez à mesure que votre modèle évolue.",es:"Añade principios ofensivos, defensivos y de transición. Reordena a medida que crece tu modelo."},
  "Define how your team plays in and out of possession. Pick preferences and tag your identity.":{fr:"Définissez comment votre équipe joue avec et sans le ballon. Choisissez des préférences et étiquetez votre identité.",es:"Define cómo juega tu equipo con y sin balón. Elige preferencias y etiqueta tu identidad."},
  "These shape your model and feed later modules.":{fr:"Elles façonnent votre modèle et alimentent les modules suivants.",es:"Dan forma a tu modelo y alimentan los módulos posteriores."},

  "Define your two base shapes. Attacking and defending both use the same formation library, so you can defend and attack in different systems.":{fr:"Définissez vos deux structures de base. L'attaque et la défense utilisent la même bibliothèque de systèmes, pour attaquer et défendre dans des dispositifs différents.",es:"Define tus dos estructuras base. El ataque y la defensa usan la misma biblioteca de formaciones, para atacar y defender en sistemas diferentes."},

  "Define the zones and channels that become the shared spatial language of your model. Every later module — moments, phases, set pieces and periodization — references these zones.":{fr:"Définissez les zones et les couloirs qui deviennent le langage spatial commun de votre modèle. Chaque module suivant — moments, phases, coups de pied arrêtés et périodisation — s'y réfère.",es:"Define las zonas y carriles que se convierten en el lenguaje espacial común de tu modelo. Cada módulo posterior —momentos, fases, balón parado y periodización— hace referencia a estas zonas."},

  "Choose a paint mode, then click or drag across cells. The attacking end is at the top.":{fr:"Choisissez un mode de coloriage, puis cliquez ou glissez sur les cellules. Le côté offensif est en haut.",es:"Elige un modo de pintado, luego haz clic o arrastra sobre las celdas. El lado ofensivo está arriba."},
  "Pulled from your Pitch Geography map.":{fr:"Tiré de votre carte de Géographie du terrain.",es:"Extraído de tu mapa de Geografía del campo."},

  "Pick from the library, or add a custom phase. You can reorder and edit everything after.":{fr:"Choisissez dans la bibliothèque ou ajoutez une phase personnalisée. Vous pouvez tout réorganiser et modifier ensuite.",es:"Elige de la biblioteca o añade una fase personalizada. Puedes reordenar y editar todo después."},
  "Build your attacking and defending routines as part of the game model. Each routine carries its structure, delivery, zones and a dedicated set-piece diagram.":{fr:"Construisez vos routines offensives et défensives dans le modèle de jeu. Chaque routine porte sa structure, son centre, ses zones et un schéma dédié.",es:"Construye tus rutinas ofensivas y defensivas dentro del modelo de juego. Cada rutina lleva su estructura, envío, zonas y un diagrama dedicado."},

  "Build your training week around the match. Every focus column pulls straight from your game model — moments, phases, principles, zones and set pieces.":{fr:"Construisez votre semaine d'entraînement autour du match. Chaque colonne de focus provient directement de votre modèle de jeu — moments, phases, principes, zones et coups de pied arrêtés.",es:"Construye tu semana de entrenamiento en torno al partido. Cada columna de enfoque proviene directamente de tu modelo de juego: momentos, fases, principios, zonas y balón parado."},

const I18N_PATTERNS = [
  { re:/^Build your game model, (.+)\.$/, fr:m=>`Construisez votre modèle de jeu, ${m[1]}.`, es:m=>`Construye tu modelo de juego, ${m[1]}.` },
  { re:/^Your phases \((\d+)\)$/, fr:m=>`Vos phases (${m[1]})`, es:m=>`Tus fases (${m[1]})` },
  { re:/^Your routines \((\d+)\)$/, fr:m=>`Vos routines (${m[1]})`, es:m=>`Tus rutinas (${m[1]})` },
  { re:/^Training week \((\d+) (session|sessions)\)$/,
    fr:m=>`Semaine d'entraînement (${m[1]} ${m[1]==='1'?'séance':'séances'})`,
    es:m=>`Semana de entrenamiento (${m[1]} ${m[1]==='1'?'sesión':'sesiones'})` },
  { re:/^Your model is (\d+)% complete\.$/, fr:m=>`Votre modèle est complété à ${m[1]} %.`, es:m=>`Tu modelo está ${m[1]}% completo.` },
  { re:/^(\d+) pages · (\d+) content (section|sections)$/,
    fr:m=>`${m[1]} pages · ${m[2]} ${m[2]==='1'?'section':'sections'} de contenu`,
    es:m=>`${m[1]} páginas · ${m[2]} ${m[2]==='1'?'sección':'secciones'} de contenido` }
];

/* translate a single known word/phrase; returns translation or null if unknown */
function trWord(s){ const e=I18N[(s||"").trim()]; return (e && e[LANG]) ? e[LANG] : null; }

/* Composed-string patterns evaluated before returning null */
function trComposed(key){
  let m;
  // library chips: "+ X" / "✓ X"
  if((m=key.match(/^([+✓]) (.+)$/))){ const w=trWord(m[2]); if(w) return m[1]+" "+w; }
  // leading icon/arrow prefix on buttons: "↑ Move up", "⭳ Export to PDF", etc.
  if((m=key.match(/^([↑↓⇧⇩⭳⭱▶⚡→←✎⧉] )(.+)$/))){ const w=trWord(m[2]); if(w) return m[1]+w; }
  // principle prefix in dropdowns: "Attacking: <user title>"
  if((m=key.match(/^(Attacking|Defending|Transition): (.+)$/))){ const w=trWord(m[1]); if(w) return w+": "+m[2]; }
  // zone names "Band · Channel" — translate both if both known
  if((m=key.match(/^(.+?) · (.+)$/))){ const a=trWord(m[1]), b=trWord(m[2]); if(a&&b) return a+" · "+b; }
  // "Attacking zones (N)" / "Defending zones (N)"
  if((m=key.match(/^Attacking zones \((\d+)\)$/))) return (LANG==='fr'?`Zones offensives (${m[1]})`:`Zonas ofensivas (${m[1]})`);
  if((m=key.match(/^Defending zones \((\d+)\)$/))) return (LANG==='fr'?`Zones défensives (${m[1]})`:`Zonas defensivas (${m[1]})`);
  // export subtitle "N% complete · N sections to finish" / "all sections complete"
  if((m=key.match(/^(\d+)% complete · (\d+) sections? to finish$/))){
    return LANG==='fr'?`${m[1]} % complété · ${m[2]} ${m[2]==='1'?'section à terminer':'sections à terminer'}`
                      :`${m[1]}% completado · ${m[2]} ${m[2]==='1'?'sección por terminar':'secciones por terminar'}`;
  }
  if((m=key.match(/^(\d+)% complete · all sections complete$/))){
    return LANG==='fr'?`${m[1]} % complété · toutes les sections terminées`:`${m[1]}% completado · todas las secciones completadas`;
  }
  return null;
}

function trPhrase(text){
  const key=text.trim();
  if(!key) return null;
  const e=I18N[key];
  if(e && e[LANG]) return text.replace(key, e[LANG]);
  for(const p of I18N_PATTERNS){
    const m=key.match(p.re);
    if(m && p[LANG]) return text.replace(key, p[LANG](m));
  }
  const c=trComposed(key);
  if(c!==null) return text.replace(key, c);
  return null;
}

function translateTree(root){
  if(!root) return;
  const walker=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      const p=n.parentNode; if(!p) return NodeFilter.FILTER_REJECT;
      const tag=p.nodeName;
      if(tag==='SCRIPT'||tag==='STYLE'||tag==='TEXTAREA') return NodeFilter.FILTER_REJECT;
      if(p.closest && p.closest('[data-noi18n]')) return NodeFilter.FILTER_REJECT;
      if(!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n=>{ const t=trPhrase(n.nodeValue); if(t!==null) n.nodeValue=t; });
  root.querySelectorAll('input[placeholder],textarea[placeholder]').forEach(el=>{
    const t=trPhrase(el.getAttribute('placeholder')); if(t!==null) el.setAttribute('placeholder',t);
  });
  root.querySelectorAll('[title]').forEach(el=>{
    const t=trPhrase(el.getAttribute('title')); if(t!==null) el.setAttribute('title',t);
  });
}

function applyI18n(){
  if(LANG==='en') return;
  if(i18nObserver) i18nObserver.disconnect();
  try{
    translateTree(document.querySelector('.app'));
    document.querySelectorAll('.dg-overlay,.pres-overlay,.toast').forEach(o=>translateTree(o));
  }catch(e){ console.warn('i18n error',e); }
  if(i18nObserver){ const app=document.querySelector('.app'); if(app) i18nObserver.observe(app,{childList:true,subtree:true}); }
}
function scheduleI18n(){
  if(LANG==='en'||i18nScheduled) return;
  i18nScheduled=true; requestAnimationFrame(()=>{ i18nScheduled=false; applyI18n(); });
}
function initI18nObserver(){
  const app=document.querySelector('.app'); if(!app) return;
  i18nObserver=new MutationObserver(()=>scheduleI18n());
  if(LANG!=='en') i18nObserver.observe(app,{childList:true,subtree:true});
}
function updateLangBtn(){
  const b=document.getElementById('langBtn'); if(b) b.textContent=LANG_LABELS[LANG];
}
function setLang(l){
  LANG=l; localStorage.setItem('pitchIQ_lang',l); updateLangBtn();
  if(i18nObserver){ i18nObserver.disconnect(); const app=document.querySelector('.app');
    if(l!=='en'&&app) i18nObserver.observe(app,{childList:true,subtree:true}); }
  refreshChrome(); renderPage(); applyI18n();
}
function cycleLang(){ const order=['en','fr','es']; setLang(order[(order.indexOf(LANG)+1)%order.length]); }

  refreshChrome(); renderPage();
  updateLangBtn(); initI18nObserver(); applyI18n();
})();
